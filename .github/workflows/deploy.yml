name: Deploy Lambda Functions

on:
  push:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.changes.outputs.functions }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Detect changed functions
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD \
            | grep -E '^[^.][^/]+/[^/]+/' \
            | awk -F'/' '{print $1"/"$2}' \
            | sort -u \
            | grep -v '^\.github' \
            | grep -v '^shared' \
            | grep -v '^node_modules' \
            | grep -v '^layer' \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "functions=$CHANGED" >> $GITHUB_OUTPUT

  deploy:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.functions != '[]'
    strategy:
      fail-fast: false
      matrix:
        function: ${{ fromJson(needs.detect-changes.outputs.functions) }}
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deploy ${{ matrix.function }}
        run: |
          FUNCTION_NAME=$(basename ${{ matrix.function }})

          # Skip image-based functions (deployed via deploy.ps1 / ECR)
          PKG=$(aws lambda get-function-configuration \
                  --function-name "$FUNCTION_NAME" \
                  --query PackageType --output text 2>/dev/null || echo "NotFound")
          if [ "$PKG" = "Image" ]; then
            echo "Skipping $FUNCTION_NAME: image-based function, deployed outside Actions"
            exit 0
          fi
          if [ "$PKG" = "NotFound" ]; then
            echo "Skipping $FUNCTION_NAME: no Lambda function by that name"
            exit 0
          fi

          cd ${{ matrix.function }}
          zip -r ../../function.zip . -x "*.zip" "*.bak" "*.ps1" "Dockerfile" "buildspec.yml"
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://../../function.zip
          rm ../../function.zip
