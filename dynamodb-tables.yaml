AWSTemplateFormatVersion: "2010-09-09"
Description: DynamoDB tables for OAuth2 config and token storage

Resources:
  # -------------------------------------------------------
  # oauth_config
  # One row per integration (e.g. pk = "spp", "tempus_spp")
  # Stores client credentials and endpoint URLs.
  # client_secret should be stored in SSM (see note below)
  # and only the SSM param name stored here if preferred.
  # -------------------------------------------------------
  OAuthConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: oauth_config
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true # AES-256 encryption at rest
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      Tags:
        - Key: Purpose
          Value: OAuth2Config

  # -------------------------------------------------------
  # oauth_tokens
  # One row per integration (app-level) or per user
  # (user-delegated). pk matches oauth_config pk for
  # app-level flows; use user id/email for delegated.
  # -------------------------------------------------------
  OAuthTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: oauth_tokens
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl # optional: auto-expire old rows (epoch seconds)
        Enabled: true
      Tags:
        - Key: Purpose
          Value: OAuth2Tokens

Outputs:
  OAuthConfigTableName:
    Value: !Ref OAuthConfigTable
  OAuthTokensTableName:
    Value: !Ref OAuthTokensTable
