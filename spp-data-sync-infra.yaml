AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Infrastructure for sppDataSync (ai/sppDataSync/) -- replaces Celigo for
  populating the SPP data CSVs in S3. Manually invoked for now (no schedule,
  no API Gateway) -- see the Lambda's own comments for the sync design.

Parameters:
  SppDataSyncImageUri:
    Type: String
    Description: >
      REQUIRED -- the ECR image URI for the sppDataSync Lambda (build and
      push via ai/sppDataSync/deploy.ps1, or the equivalent docker commands,
      before first deploying this stack; the Lambda resource needs the
      image to already exist in ECR).

  LambdaExecutionRoleArn:
    Type: String
    Default: arn:aws:iam::776528084998:role/TopStepLambdaExecutionRole
    Description: >
      Reuses the same execution role already used by every other Lambda in
      this project (CloudWatch Logs, S3, DynamoDB, SSM access).

  ResourceSuffix:
    Type: String
    Default: ""
    Description: >
      Appended to every resource name in this stack (e.g. "-acme" ->
      "sppDataSync-acme") -- lets a second customer deploy this same
      template as its own stack without colliding with an existing one.
      Left empty for TopStep's own stack, which keeps the original
      unsuffixed names ("sppDataSync", "sppSyncWatermarks") exactly as they
      are today -- changing this on an EXISTING stack renames (replaces)
      its Lambda and DynamoDB table, so never set this on a redeploy of an
      already-running customer's stack, only at first creation.

  SSMParamPrefix:
    Type: String
    Default: /spp/top-step
    Description: >
      REQUIRED -- SSM Parameter Store path prefix this customer's SPP API
      key/XML URL live under (expects {prefix}/sandboxKey,
      {prefix}/productionKey, {prefix}/sandboxXMLURL,
      {prefix}/productionXMLURL to already exist -- this stack doesn't
      create them). Deliberately has no implicit code-level fallback (see
      sppDataSync.js) -- every customer, including this default for
      TopStep's own stack, must set this explicitly so a misconfigured
      deployment fails loudly instead of silently reading another
      customer's SPP credentials.

Resources:
  SppSyncWatermarksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "sppSyncWatermarks${ResourceSuffix}"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  SppDataSyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "sppDataSync${ResourceSuffix}"
      PackageType: Image
      Code:
        ImageUri: !Ref SppDataSyncImageUri
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 900 # 15 minutes -- Lambda's hard maximum; large tables may
                   # still need multiple manual re-invocations to fully
                   # catch up on their first (full-load) run.
      MemorySize: 3008 # bumped from 1024 -- a 288k-row/16-field production
                       # table maxed out 1024 MB (fetchAllPages holds the
                       # whole batch in memory, and mergeIntoS3Csv loads the
                       # full existing CSV + full new batch into DuckDB at
                       # once), so bigger tables risk OOM at the old size.
                       # Also buys more CPU, which Lambda scales with memory.
      Environment:
        Variables:
          WATERMARKS_TABLE: !Ref SppSyncWatermarksTable
          SSM_PARAM_PREFIX: !Ref SSMParamPrefix

Outputs:
  FunctionName:
    Value: !Ref SppDataSyncFunction
  WatermarksTableName:
    Value: !Ref SppSyncWatermarksTable
